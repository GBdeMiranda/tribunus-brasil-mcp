[project]
name = "tribunus-brasil-mcp"
version = "0.1.0"
description = "Tribunus Brasil MCP - Civic scrutiny and diagnostic server for the Brazilian National Congress"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "brazil", "congress", "senate", "chamber-of-deputies", "transparency", "llm", "tribunus"]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.13.1,<2",
    "pymupdf>=1.26.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tribunus-brasil-mcp = "tribunus_brasil_mcp.mcp_server:main"
tribunus_brasil_mcp = "tribunus_brasil_mcp.mcp_server:main"